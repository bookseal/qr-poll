<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>QR Poll · Audience</title>
  <link rel="stylesheet" href="/style.css?v=20" />
</head>
<body>
  <div class="wrap">
    <header>
      <h1 id="title">…</h1>
      <div class="code">🙋 Audience · anonymous participation · code <span id="code"></span></div>
    </header>
    <nav id="tabs" class="tabs" aria-label="Polls"></nav>
    <div id="pollbox"></div>
    <ul id="feed"></ul>
  </div>
  <div class="composer" id="composer" hidden>
    <form class="inner" id="form">
      <textarea id="text" rows="1" maxlength="500" placeholder="Write anonymously…" required></textarea>
      <button id="send">Send</button>
    </form>
  </div>
  <a id="chatToggle" class="chat-toggle" aria-label="소리함 열기">소리함</a>
  <aside id="chatPanel" class="chat-panel" hidden aria-label="소리함">
    <div class="chat-head"><div><strong>소리함</strong><small>누구나 자유롭게</small></div><a id="chatClose" class="chat-close" aria-label="Back to polls" href="#">×</a></div>
    <ul id="chatFeed" class="chat-feed"></ul>
    <form class="chat-composer" id="chatForm"><textarea id="chatText" rows="1" maxlength="500" placeholder="Say anything…" required></textarea><button id="chatSend">Send</button></form>
  </aside>
  <script type="module">
    import { connect, send, buildLi, setCount, renderPoll, updatePoll, upgradeAuthorship } from "/app.js?v=20";
    const pathParts = location.pathname.split("/").filter(Boolean);
    const chatMode = pathParts.at(-1) === "chat";
    const code = chatMode ? pathParts.at(-2) : pathParts.at(-1);
    const feed = document.getElementById("feed");
    const pollbox = document.getElementById("pollbox");
    const composer = document.getElementById("composer");
    document.getElementById("code").textContent = code;
    // ?blur=1 : 메시지 본문 블러(개인정보 스크린샷용)
    if (new URLSearchParams(location.search).get("blur") === "1") {
      const s = document.createElement("style");
      s.textContent = "#feed .txt,#chatFeed .txt{filter:blur(7px)}";
      document.head.appendChild(s);
    }

    const polls = new Map();
    const msgs = new Map();
    let stage = { focus: "qa", sort: "recent" };
    let active = "qa";
    let chatOpen = chatMode;
    let unreadChat = 0;
    const qa = { id: "qa", q: "소리함", type: "text", sort: "recent" };
    const chatPanel = document.getElementById("chatPanel");
    const chatToggle = document.getElementById("chatToggle");
    const chatFeed = document.getElementById("chatFeed");
    const chatReadKey = `qr-poll:chat-read:${code}`;
    const markChatRead = () => localStorage.setItem(chatReadKey, String(Date.now()));
    document.body.classList.toggle("chat-page", chatMode);
    chatToggle.href = `/r/${encodeURIComponent(code)}/chat`;
    chatClose.href = `/r/${encodeURIComponent(code)}`;
    chatToggle.hidden = chatMode;
    chatPanel.hidden = !chatMode;
    chatToggle.addEventListener("click", markChatRead);
    document.getElementById("chatClose").addEventListener("click", markChatRead);
    if (chatMode) markChatRead();

    function tabs() {
      const items = [...polls.values()];
      let activeBtn = null;
      document.getElementById("tabs").replaceChildren(...items.map((p) => {
        const b = document.createElement("button"); b.type = "button";
        b.className = "tab" + (active === p.id ? " active" : "");
        b.textContent = p.q; b.onclick = () => { if (p.id === stage.focus) { active = p.id; applyStage(); } };
        if (p.id !== stage.focus) b.disabled = true;
        if (active === p.id) activeBtn = b;
        return b;
      }));
      // 가로 한 줄짜리 탭바라 활성 poll이 오른쪽 밖으로 밀려나 있을 수 있어, 항상 보이는 위치로 스크롤한다
      activeBtn?.scrollIntoView({ inline: "center", block: "nearest", behavior: "smooth" });
    }

    function renderChat() {
      const list = [...msgs.values()].filter((m) => (m.pollId || "qa") === "qa");
      chatFeed.replaceChildren(...list.map((m) => buildLi(code, m)));
      if (chatOpen) { unreadChat = 0; chatToggle.classList.remove("has-unread"); }
    }

    function setChat(open) {
      chatOpen = open;
      chatToggle.classList.toggle("open", open);
      if (open) renderChat();
    }

    function applyStage() {
      const focus = stage.focus;
      if (active !== focus) active = focus;
      const p = active === qa.id ? null : polls.get(active);
      tabs();
      if (p) {
        const textMode = p.type === "text";
        feed.hidden = !textMode;
        composer.hidden = !textMode; // qa(소리함)는 아래 chat-panel의 자체 composer를 쓴다
        pollbox.hidden = false;
        pollbox.replaceChildren(renderPoll(code, p, true));
        const list = [...msgs.values()].filter((m) => m.pollId === active);
        feed.replaceChildren(...list.map((m) => buildLi(code, m)));
      } else {
        pollbox.hidden = true;
        pollbox.replaceChildren();
        feed.hidden = false;
        composer.hidden = true;
        feed.replaceChildren();
      }
      renderChat();
    }

    connect(code, {
      onMeta: (d) => {
        document.getElementById("title").textContent = d.title;
        (d.polls || []).forEach((p) => polls.set(p.id, p));
        if (d.stage) stage = d.stage;
        (d.qa ? [d.qa] : []).forEach((p) => Object.assign(qa, p));
        (d.polls || []).forEach((p) => polls.set(p.id, p));
        active = stage.focus === "qa" ? qa.id : stage.focus;
        applyStage();
      },
      onMsg: (m) => {
        msgs.set(m.id, m);
        if (m.pollId === active) {
          const atBottom = window.innerHeight + window.scrollY >= document.body.scrollHeight - 60;
          const li = buildLi(code, m); feed.append(li);
          if (atBottom) li.scrollIntoView({ behavior: "smooth" });
        }
        const lastRead = Number(localStorage.getItem(chatReadKey) || 0);
        if ((m.pollId || "qa") === "qa" && !chatOpen && m.ts > lastRead) { unreadChat++; chatToggle.classList.add("has-unread"); }
        renderChat();
      },
      onReact: ({ id, reactions }) => { setCount(feed, id, reactions); setCount(chatFeed, id, reactions); },
      onDel: ({ id }) => { msgs.delete(id); feed.querySelector(`li[data-id="${id}"]`)?.remove(); chatFeed.querySelector(`li[data-id="${id}"]`)?.remove(); },
      onPin: ({ id, on }) => { feed.querySelector(`li[data-id="${id}"]`)?.classList.toggle("pinned", on); chatFeed.querySelector(`li[data-id="${id}"]`)?.classList.toggle("pinned", on); },
      onEdit: ({ id, text }) => {
        const m = msgs.get(id); if (m) m.text = text;
        const t = feed.querySelector(`li[data-id="${id}"] .txt`); if (t) t.textContent = text;
        const t2 = chatFeed.querySelector(`li[data-id="${id}"] .txt`); if (t2) t2.textContent = text;
      },
      onVote: ({ poll, counts }) => {
        const p = polls.get(poll); if (p) p.counts = counts;
        if (active === poll) {
          const w = pollbox.querySelector(`.poll[data-poll="${poll}"]`);
          if (w) updatePoll(w, counts);
        }
      },
      onStage: (s) => { stage = { focus: s.focus, sort: s.sort }; applyStage(); },
      onPolls: (items) => { polls.clear(); items.forEach((p) => polls.set(p.id, p)); applyStage(); },
    });

    const form = document.getElementById("form");
    const text = document.getElementById("text");
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const v = text.value.trim();
      if (!v) return;
      text.value = "";
      const msg = await send(code, v, active);
      if (!msg) text.value = v; // restore on failure
      else upgradeAuthorship(feed, code, msg); // SSE echo가 fetch보다 먼저 왔을 수 있어 편집 버튼 뒤늦게 부착
    });
    text.addEventListener("keydown", (e) => {
      if (e.isComposing || e.keyCode === 229) return; // IME 조합 중
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
    });

    const chatForm = document.getElementById("chatForm");
    const chatText = document.getElementById("chatText");
    chatForm.addEventListener("submit", async (e) => {
      e.preventDefault(); const v = chatText.value.trim(); if (!v) return;
      chatText.value = "";
      const msg = await send(code, v, "qa");
      if (!msg) chatText.value = v;
      else upgradeAuthorship(chatFeed, code, msg);
    });
    chatText.addEventListener("keydown", (e) => {
      if (e.isComposing || e.keyCode === 229) return;
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); chatForm.requestSubmit(); }
    });
  </script>
</body>
</html>
