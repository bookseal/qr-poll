<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="color-scheme" content="light" />
  <title>QR Poll · Audience</title>
  <link rel="stylesheet" href="/style.css?v=22" />
</head>
<body>
  <main class="wrap" id="pollPage">
    <header class="audience-head">
      <div>
        <h1 id="title">…</h1>
        <div class="code">🙋 Audience · anonymous participation · code <span id="code"></span></div>
      </div>
      <a id="chatToggle" class="chat-toggle">Open chat</a>
    </header>
    <nav id="tabs" class="tabs" aria-label="Polls"></nav>
    <div id="pollbox"></div>
    <ul id="feed"></ul>
  </main>
  <div class="composer" id="composer" hidden>
    <form class="inner" id="form">
      <textarea id="text" rows="1" maxlength="500" placeholder="Write anonymously…" required></textarea>
      <button id="send">Send</button>
    </form>
  </div>
  <main id="chatPanel" class="chat-panel" hidden aria-labelledby="chatTitle">
    <header class="chat-head">
      <a id="chatClose" class="chat-close"><span aria-hidden="true">←</span> Polls</a>
      <div class="chat-heading">
        <h1 id="chatTitle">Say Anything</h1>
        <p id="chatEvent"></p>
      </div>
    </header>
    <div class="chat-history">
      <div id="chatScroll" class="chat-scroll" tabindex="0" aria-label="Chat messages" role="region">
        <ul id="chatFeed" class="chat-feed" aria-live="off" aria-relevant="additions"></ul>
      </div>
      <p id="chatEmpty" class="chat-empty" hidden>No messages yet. Start the conversation.</p>
      <button id="chatLatest" class="chat-latest" type="button" hidden>Latest messages ↓</button>
    </div>
    <form class="chat-composer" id="chatForm">
      <p id="chatError" class="chat-error" role="status" hidden></p>
      <textarea id="chatText" rows="1" maxlength="500" placeholder="Message anonymously…" aria-label="Message" required></textarea>
      <button id="chatSend" type="submit">Send</button>
    </form>
  </main>
  <script type="module">
    import { connect, send, buildLi, setCount, renderPoll, sortMessages, updatePoll, upgradeAuthorship } from "/app.js?v=23";
    const pathParts = location.pathname.split("/").filter(Boolean);
    const chatMode = pathParts.at(-1) === "chat";
    const code = chatMode ? pathParts.at(-2) : pathParts.at(-1);
    const identityLink = document.createElement("a");
    identityLink.href = `https://qr-poll.futurereadycampus.com/identity/import?code=${encodeURIComponent(code)}`;
    identityLink.textContent = location.hostname === "qr-poll.futurereadycampus.com"
      ? "기존 주소에서 참여한 기록 가져오기" : "기존 참여 기록을 유지하며 새 주소로 이동";
    identityLink.style.cssText = "display:block;padding:10px;text-align:center;font-size:13px;background:#fff3df;color:#583700";
    document.body.prepend(identityLink);
    const feed = document.getElementById("feed");
    const pollbox = document.getElementById("pollbox");
    const composer = document.getElementById("composer");
    document.getElementById("code").textContent = code;
    // ?blur=1 : 메시지 본문 블러(개인정보 스크린샷용)
    if (new URLSearchParams(location.search).get("blur") === "1") {
      const s = document.createElement("style");
      s.textContent = "#feed .txt,#chatFeed .txt{filter:blur(7px)}";
      document.head.appendChild(s);
    }

    const polls = new Map();
    const msgs = new Map();
    let stage = { focus: "qa", sort: "recent" };
    let active = "qa";
    let initialMessagesLoaded = false;
    const chatPanel = document.getElementById("chatPanel");
    const chatToggle = document.getElementById("chatToggle");
    const chatClose = document.getElementById("chatClose");
    const chatFeed = document.getElementById("chatFeed");
    const chatScroll = document.getElementById("chatScroll");
    const chatEmpty = document.getElementById("chatEmpty");
    const chatLatest = document.getElementById("chatLatest");
    let followingLatest = true;
    const chatReadKey = `qr-poll:chat-read:${code}`;
    const chatTime = new Intl.DateTimeFormat(undefined, { hour: "numeric", minute: "2-digit" });
    const markChatRead = () => localStorage.setItem(chatReadKey, String(Date.now()));
    const pollPath = `/r/${encodeURIComponent(code)}`;
    chatToggle.href = `${pollPath}/chat${location.search}`;
    chatClose.href = `${pollPath}${location.search}`;
    document.body.classList.toggle("chat-page", chatMode);
    document.getElementById("pollPage").hidden = chatMode;
    chatPanel.hidden = !chatMode;
    if (chatMode) {
      document.title = "Say Anything · QR Poll";
      markChatRead();
      const viewport = window.visualViewport;
      viewport?.addEventListener("resize", () => {
        if (viewport.scale === 1) document.body.style.setProperty("--chat-viewport", `${viewport.height}px`);
      });
      new ResizeObserver(() => {
        if (followingLatest) scrollToLatest();
      }).observe(chatScroll);
    }

    function tabs() {
      const items = [...polls.values()];
      let activeBtn = null;
      document.getElementById("tabs").replaceChildren(...items.map((p) => {
        const b = document.createElement("button"); b.type = "button";
        b.className = "tab" + (active === p.id ? " active" : "");
        b.textContent = p.q; b.onclick = () => { if (p.id === stage.focus) { active = p.id; applyStage(); } };
        if (p.id !== stage.focus) b.disabled = true;
        if (active === p.id) activeBtn = b;
        return b;
      }));
      // 가로 한 줄짜리 탭바라 활성 poll이 오른쪽 밖으로 밀려나 있을 수 있어, 항상 보이는 위치로 스크롤한다
      activeBtn?.scrollIntoView({ inline: "center", block: "nearest", behavior: "smooth" });
    }

    function nearLatest() {
      return chatScroll.scrollHeight - chatScroll.scrollTop - chatScroll.clientHeight < 48;
    }

    function scrollToLatest() {
      followingLatest = true;
      chatScroll.scrollTop = chatScroll.scrollHeight;
      chatLatest.hidden = true;
    }

    chatScroll.addEventListener("scroll", () => {
      followingLatest = nearLatest();
      chatLatest.hidden = followingLatest;
    });
    chatLatest.addEventListener("click", () => {
      chatScroll.focus({ preventScroll: true });
      scrollToLatest();
    });

    function appendChatMessage(m) {
      if (chatFeed.querySelector(`li[data-id="${m.id}"]`)) return;
      const row = buildLi(code, m);
      const date = new Date(m.ts);
      if (Number.isFinite(date.getTime())) {
        const time = document.createElement("time");
        time.dateTime = date.toISOString();
        time.textContent = chatTime.format(date);
        row.append(time);
      }
      chatFeed.append(row);
      chatEmpty.hidden = true;
      if (followingLatest) scrollToLatest();
      else chatLatest.hidden = false;
    }

    function renderPollResponses() {
      const responses = [...msgs.values()].filter((m) => m.pollId === active);
      const rows = new Map([...feed.children].map((row) => [row.dataset.id, row]));
      const focused = feed.contains(document.activeElement) ? document.activeElement : null;
      const sorted = sortMessages(responses, polls.get(active)?.sort);
      sorted.forEach((message, index) => {
        const row = rows.get(String(message.id)) || buildLi(code, message);
        if (feed.children[index] !== row) feed.insertBefore(row, feed.children[index] || null);
      });
      while (feed.children.length > sorted.length) feed.lastElementChild.remove();
      if (focused?.isConnected && document.activeElement !== focused) focused.focus({ preventScroll: true });
    }

    function applyStage() {
      const focus = stage.focus;
      if (active !== focus) active = focus;
      const p = polls.get(active);
      tabs();
      if (p) {
        const textMode = p.type === "text";
        feed.hidden = !textMode;
        composer.hidden = !textMode;
        pollbox.hidden = false;
        pollbox.replaceChildren(renderPoll(code, p, true));
        if (textMode) renderPollResponses();
        else feed.replaceChildren();
      } else {
        pollbox.hidden = true;
        pollbox.replaceChildren();
        feed.hidden = false;
        composer.hidden = true;
        feed.replaceChildren();
      }
    }

    connect(code, {
      onMeta: (d) => {
        if (chatMode) {
          document.getElementById("chatEvent").textContent = d.title;
          return;
        }
        document.getElementById("title").textContent = d.title;
        (d.polls || []).forEach((p) => polls.set(p.id, p));
        if (d.stage) stage = d.stage;
        applyStage();
      },
      onMsg: (m) => {
        if (msgs.has(m.id)) return;
        msgs.set(m.id, m);
        if ((m.pollId || "qa") === "qa") {
          if (chatMode) appendChatMessage(m);
          else if (m.ts > Number(localStorage.getItem(chatReadKey) || 0)) {
            chatToggle.classList.add("has-unread");
            chatToggle.setAttribute("aria-label", "Open chat, unread messages");
          }
          return;
        }
        if (!chatMode && initialMessagesLoaded && m.pollId === active) renderPollResponses();
      },
      onReact: ({ id, reactions }) => {
        const m = msgs.get(id);
        if (!m) return;
        m.reactions = reactions;
        setCount(feed, id, reactions);
        setCount(chatFeed, id, reactions);
        if (!chatMode && m.pollId === active && polls.get(active)?.sort === "top") renderPollResponses();
      },
      onDel: ({ id }) => {
        msgs.delete(id);
        feed.querySelector(`li[data-id="${id}"]`)?.remove();
        chatFeed.querySelector(`li[data-id="${id}"]`)?.remove();
        chatEmpty.hidden = chatFeed.childElementCount > 0;
      },
      onPin: ({ id, on }) => {
        const m = msgs.get(id);
        if (!m) return;
        m.pinned = on;
        feed.querySelector(`li[data-id="${id}"]`)?.classList.toggle("pinned", on);
        chatFeed.querySelector(`li[data-id="${id}"]`)?.classList.toggle("pinned", on);
        if (!chatMode && m.pollId === active) renderPollResponses();
      },
      onEdit: ({ id, text }) => {
        const m = msgs.get(id); if (m) m.text = text;
        const t = feed.querySelector(`li[data-id="${id}"] .txt`); if (t) t.textContent = text;
        const t2 = chatFeed.querySelector(`li[data-id="${id}"] .txt`); if (t2) t2.textContent = text;
      },
      onVote: ({ poll, counts }) => {
        const p = polls.get(poll); if (p) p.counts = counts;
        if (active === poll) {
          const w = pollbox.querySelector(`.poll[data-poll="${poll}"]`);
          if (w) updatePoll(w, counts);
        }
      },
      onStage: (s) => {
        if (chatMode) return;
        stage = s;
        const poll = polls.get(s.focus);
        if (poll) poll.sort = s.sort;
        applyStage();
      },
      onPolls: (items) => {
        if (chatMode) return;
        polls.clear(); items.forEach((p) => polls.set(p.id, p)); applyStage();
      },
    }).then(() => {
      initialMessagesLoaded = true;
      if (!chatMode) {
        if (polls.get(active)?.type === "text") renderPollResponses();
        return;
      }
      chatEmpty.hidden = chatFeed.childElementCount > 0;
      chatFeed.setAttribute("aria-live", "polite");
    });

    const form = document.getElementById("form");
    const text = document.getElementById("text");
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const v = text.value.trim();
      if (!v) return;
      text.value = "";
      const msg = await send(code, v, active);
      if (!msg) text.value = v; // restore on failure
      else upgradeAuthorship(feed, code, msg); // SSE echo가 fetch보다 먼저 왔을 수 있어 편집 버튼 뒤늦게 부착
    });
    text.addEventListener("keydown", (e) => {
      if (e.isComposing || e.keyCode === 229) return; // IME 조합 중
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
    });

    const chatForm = document.getElementById("chatForm");
    const chatText = document.getElementById("chatText");
    const chatSend = document.getElementById("chatSend");
    const chatError = document.getElementById("chatError");
    chatForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const draft = chatText.value;
      const text = draft.trim();
      if (!text || chatSend.disabled) return;
      chatSend.disabled = true;
      chatError.hidden = true;
      try {
        const msg = await send(code, text, "qa");
        if (!msg) throw new Error("Message not sent");
        if (chatText.value === draft) chatText.value = "";
        const message = msgs.get(msg.id) || msg;
        msgs.set(msg.id, message);
        appendChatMessage(message);
        upgradeAuthorship(chatFeed, code, message);
        scrollToLatest();
      } catch {
        chatError.textContent = "Message couldn’t be sent. Try again.";
        chatError.hidden = false;
      } finally {
        chatSend.disabled = false;
      }
    });
    chatText.addEventListener("keydown", (e) => {
      if (e.isComposing || e.keyCode === 229) return;
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); chatForm.requestSubmit(); }
    });
  </script>
</body>
</html>
