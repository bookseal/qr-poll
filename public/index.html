<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>QR Poll</title>
  <link rel="stylesheet" href="/style.css?v=21" />
</head>
<body>
  <div class="center">
    <div class="card">
      <h1>💬 QR Poll</h1>

      <p class="hint-sm">Join an event without signing in.</p>

      <p class="count">🙋 <b>Audience</b> — join with an event code</p>
      <form id="joinForm">
        <input id="code" inputmode="numeric" placeholder="e.g. 9587463" required autofocus />
        <button>Join event</button>
      </form>

      <div class="or">Team presenters</div>
      <p><a id="presenterLink" href="/presenter">Sign in to manage or create events →</a></p>
    </div>
    <a class="report-link" href="/report/">📄 이 서비스를 AI로 어떻게 만들었나 — 빌드 리포트 →</a>
  </div>

  <script src="/client-config.js"></script>
  <script type="module">
    document.getElementById("joinForm").addEventListener("submit", (e) => {
      e.preventDefault();
      location.href = "/r/" + encodeURIComponent(code.value.trim());
    });

    document.getElementById("presenterLink").href = (window.QR_PUBLIC_ORIGIN || "") + "/presenter";
  </script>
</body>
</html>
